services:
  mysql:
    image: mysql:8.0
    container_name: dan1-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dan1root
      MYSQL_DATABASE: dan1
      MYSQL_USER: dan1
      MYSQL_PASSWORD: dan1pass
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - dan1_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dan1_mysql_data:
